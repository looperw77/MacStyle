name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: .\build.ps1
        shell: powershell
      - run: .\tests\run.ps1
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: MacStyle
          path: |
            build/MacStyle.exe
            build/MacStyle-Update-v2.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MacStyle
          path: out
      - run: |
          (cat .github/release-notes.md; echo; echo '```'; cd out; sha256sum *; echo '```') > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "MacStyle $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
